<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Autumn is Calling</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#1c140e;color:#fff0d4;font-family:Georgia,serif;text-align:center}header{padding:19px 12px 11px;background:linear-gradient(#482516,#20160f)}h1{margin:0;font-size:clamp(1.8rem,4.5vw,3.5rem);letter-spacing:.04em;text-shadow:0 2px 9px #000}header p{margin:7px 0;font-size:clamp(.8rem,1.6vw,1rem)}.stage{position:relative;width:min(100%,1536px);aspect-ratio:3/2;margin:auto;overflow:hidden;background:#3b251b;touch-action:pan-y}.scene,.second{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.scene{z-index:2;transform-origin:100% 100%;transition:transform 1.6s cubic-bezier(.22,.61,.36,1),opacity 1.6s;pointer-events:none}.stage.revealed .scene{transform:translate(-95%,-10%) rotate(-14deg) scale(.8);opacity:0}.second{z-index:1;background:radial-gradient(ellipse at 50% 30%,#5b658c,#1d3441 45%,#10171e 90%);display:grid;place-content:center;padding:5%;color:#dce9ff}.second h2{font-size:clamp(1.6rem,4vw,3.2rem);margin:0 0 1rem}.second p{max-width:600px;line-height:1.5}.second button{background:#31556d;color:white;border:1px solid #abc;padding:12px;border-radius:12px;cursor:pointer}.hotspots{position:absolute;inset:0;z-index:3;pointer-events:none;transition:opacity .7s}.stage.revealed .hotspots{opacity:0;pointer-events:none}.hotspot{position:absolute;border:0;background:transparent;border-radius:50%;cursor:pointer;pointer-events:auto;touch-action:manipulation;outline-offset:3px}.hotspot:focus-visible{outline:3px solid #ffe18e}.hotspot:hover{box-shadow:inset 0 0 0 2px #ffe19b88}.hotspot:active{background:#ffe49d20}.effect{position:absolute;z-index:4;pointer-events:none;color:#fff6c2;text-shadow:1px 2px 5px #251007;font-weight:bold;font-size:clamp(13px,2.1vw,27px);opacity:0}.effect.show{animation:pop 1.3s ease-out}.note{position:absolute;z-index:5;left:50%;bottom:5%;transform:translateX(-50%);max-width:90%;padding:12px 19px;border-radius:13px;background:#24150ddc;border:1px solid #e8ba73;color:#fff5d6;opacity:0;pointer-events:none;transition:opacity .2s;font-size:clamp(12px,1.5vw,18px)}.note.show{opacity:1}.toolbar{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:14px}.toolbar button,.peel{border:1px solid #b68a50;background:#3a2518;color:#ffe6b1;border-radius:10px;padding:10px 15px;font:inherit;cursor:pointer}.peel{position:absolute;z-index:6;right:1.2%;bottom:1.5%;display:none;background:#f1d6a3;color:#392315;box-shadow:0 2px 10px #0008}.peel.ready{display:block}.stage.revealed .peel{display:none}.status{font-size:.88rem;opacity:.85;min-height:1.3em;margin:0 0 14px}.animal{position:absolute;z-index:4;pointer-events:none;display:none;font-size:clamp(15px,3vw,36px);filter:drop-shadow(0 2px 3px #0009)}.animal.go{display:block}.woodpecker.go{animation:peck .16s 7 alternate;left:3%;top:18%}.deer.go{animation:rise 2.2s ease-in-out;left:69%;top:54%}.chipmunk.go{animation:sit 1.4s ease-in-out;left:6%;top:48%}.beaver.go{animation:tail 1.5s ease-in-out;left:35%;top:76%}.frog.go{animation:croak .5s 3 alternate;left:80%;top:82%}.chickadee.go{animation:chickadeeBridge 2.5s ease-in-out forwards;left:92%;top:24%}.chickadee.at-bridge{left:49%;top:36%;display:block}.bluejay.go{left:47%;top:8%;display:block;animation:jayFlap .22s 7 alternate}.bluejay.at-bridge{left:55%;top:36%;display:block}.bluejay.fly-bridge{left:47%;top:8%;display:block;animation:jayBridge 2.4s ease-in-out forwards}.chipmunk-nut{position:absolute;left:9%;top:51%;z-index:4;pointer-events:none;font-size:clamp(10px,1.8vw,22px);display:none}.chipmunk-nut.drop{display:block;animation:nutDrop 1.2s ease-in forwards}.beaver.crouch{left:35%;top:79%;display:block;transform:scaleY(.55);transform-origin:bottom}.deer.head-up{left:69%;top:50%;display:block;transform:rotate(-16deg)}@keyframes peck{from{transform:translateX(0) rotate(-12deg)}to{transform:translateX(12px) rotate(15deg)}}@keyframes rise{0%,100%{transform:translateY(12px) rotate(12deg)}50%{transform:translateY(-23px) rotate(-9deg)}}@keyframes sit{0%,100%{transform:scaleY(.7)}50%{transform:translateY(-18px) scaleY(1.2)}}@keyframes tail{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(30deg)}}@keyframes croak{from{transform:scale(1)}to{transform:scale(1.35)}}@keyframes fly{0%{transform:translate(0,0) rotate(0)}55%{transform:translate(-520%,-35%) rotate(-15deg)}100%{transform:translate(-680%,75%) rotate(0)}}@keyframes chickadeeBridge{0%{transform:translate(0,0)}100%{transform:translate(-650%,50%);opacity:0}}@keyframes jayFlap{from{transform:rotate(-15deg) scaleY(.7)}to{transform:rotate(15deg) scaleY(1.2)}}@keyframes jayBridge{0%{transform:translate(0,0)}100%{transform:translate(180%,650%);opacity:0}}@keyframes nutDrop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(150%);opacity:1}}@keyframes pop{0%{opacity:0;transform:translateY(15px) scale(.5)}30%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translateY(-35px) scale(1.2)}}.hint{font-size:.9rem;max-width:780px;margin:5px auto 18px;padding:0 12px;line-height:1.5}@media(prefers-reduced-motion:reduce){.effect.show,.animal.go{animation-duration:.01ms!important}.scene{transition:none}}
</style></head><body><header><h1>🍁 Autumn is Calling 🍁</h1><p>Listen to the forest. Every creature has a story.</p></header><main><div class="stage" id="stage" aria-label="Interactive autumn forest"><div class="second"><h2>🌙 Another World Awaits</h2><p>The next forest awaits beyond the page.</p><button id="return">Return to the forest</button></div><img class="scene" src="autumn-forest.png" alt="Golden autumn forest with creek, wooden bridge, birds, deer, beaver, frog, chipmunk, hidden geocaches and colorful trees"><div class="hotspots" id="hotspots">
<button class="hotspot" style="left:43%;top:3%;width:12%;height:15%" data-animal="bluejay" aria-label="Click the blue jay"></button>
<button class="hotspot" style="left:1%;top:13%;width:8%;height:19%" data-animal="woodpecker" aria-label="Click the woodpecker"></button>
<button class="hotspot" style="left:65%;top:52%;width:16%;height:24%" data-animal="deer" aria-label="Click the stag"></button>
<button class="hotspot" style="left:1%;top:47%;width:13%;height:13%" data-animal="chipmunk" aria-label="Click the chipmunk"></button>
<button class="hotspot" style="left:90%;top:17%;width:9%;height:14%" data-animal="chickadee" aria-label="Click the chickadee"></button>
<button class="hotspot" style="left:75%;top:83%;width:16%;height:14%" data-animal="frog" aria-label="Click the frog"></button>
<button class="hotspot" style="left:29%;top:72%;width:21%;height:20%" data-animal="beaver" aria-label="Click the beaver"></button>
</div><span class="chipmunk-nut" id="chipmunk-nut">🌰</span><span class="animal bluejay" id="bluejay">🐦</span><span class="animal woodpecker" id="woodpecker">✴</span><span class="animal deer" id="deer">🍂</span><span class="animal chipmunk" id="chipmunk">🍁</span><span class="animal chickadee" id="chickadee">🐦</span><span class="animal frog" id="frog">♫</span><span class="animal beaver" id="beaver">💦</span><div class="note" id="note" aria-live="polite"></div><button class="peel" id="peel" aria-label="Peel away the forest">↶ Peel back the forest</button></div><div class="toolbar"><button id="sound" aria-pressed="false">🔇 Sound off</button><button id="reset">↻ Reset forest</button></div><p class="status" id="status" aria-live="polite">Explore the creatures. A secret sequence unlocks the next layer.</p><p class="hint">Listen closely, explore the forest, and discover what lies beyond the turning page.</p></main><script>
(()=>{'use strict';const stage=document.getElementById('stage'),note=document.getElementById('note'),status=document.getElementById('status'),peel=document.getElementById('peel');let sound=false,ctx=null,progress=0,timeout,bluejayClicks=0;const sequence=['woodpecker','frog','deer','chipmunk','chickadee','beaver'];const messages={bluejay:'The blue jay calls and flaps its wings!',woodpecker:'Tap, tap, tap! The woodpecker drums on the old tree.',deer:'The stag lifts his head and listens to the woodland.',chipmunk:'The chipmunk sits up to inspect the visitors.',chickadee:'The chickadee flutters toward the bridge!',frog:'Rrribbit! The frog calls from beside the stream.',beaver:'Splash! The beaver flicks his broad tail.'};function showNote(msg){note.textContent=msg;note.classList.add('show');clearTimeout(timeout);timeout=setTimeout(()=>note.classList.remove('show'),2300)}function tone(freq,duration,type='sine',volume=.07,delay=0){if(!sound)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let osc=ctx.createOscillator(),gain=ctx.createGain(),now=ctx.currentTime+delay;osc.type=type;osc.frequency.setValueAtTime(freq,now);gain.gain.setValueAtTime(volume,now);gain.gain.exponentialRampToValueAtTime(.001,now+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start(now);osc.stop(now+duration+.02)}catch(e){}}function play(name){if(name==='bluejay'){tone(740,.15,'sawtooth',.025);tone(610,.19,'sawtooth',.025,.2)}if(name==='woodpecker')for(let i=0;i<6;i++)tone(210+i%2*45,.055,'square',.025,i*.13);if(name==='frog'){tone(125,.3,'sawtooth',.05);tone(95,.34,'sawtooth',.045,.33)}if(name==='chickadee'){tone(900,.12,'sine',.04);tone(1250,.15,'sine',.04,.14);tone(1080,.15,'sine',.04,.31)}if(name==='beaver')for(let i=0;i<4;i++)tone(140+i*70,.09,'triangle',.035,i*.08);if(name==='chipmunk')tone(1100,.12,'sine',.035);if(name==='deer')tone(420,.35,'sine',.025)}function clickAnimal(name){if(stage.classList.contains('revealed'))return;const el=document.getElementById(name);if(name==='bluejay'){bluejayClicks++;el.classList.remove('go','fly-bridge');if(bluejayClicks===1){void el.offsetWidth;el.classList.add('go');play(name);showNote(messages.bluejay)}else{el.classList.remove('at-bridge');void el.offsetWidth;el.classList.add('fly-bridge');play(name);showNote('The blue jay flies to the bridge!');setTimeout(()=>{el.classList.remove('fly-bridge');el.classList.add('at-bridge')},2400)}return;}if(name==='chickadee'){el.classList.remove('at-bridge')}if(name==='chipmunk'){const nut=document.getElementById('chipmunk-nut');nut.classList.remove('drop');void nut.offsetWidth;nut.classList.add('drop')}if(name==='deer'){el.classList.add('head-up')}if(name==='beaver'){el.classList.add('crouch')}el.classList.remove('go');void el.offsetWidth;el.classList.add('go');setTimeout(()=>{el.classList.remove('go');if(name==='chickadee')el.classList.add('at-bridge')},name==='chickadee'?2500:2200);play(name);showNote(messages[name]);if(name===sequence[progress]){progress++;status.textContent=`The woodland is listening… ${progress} of ${sequence.length} secret actions.`;if(progress===sequence.length){peel.classList.add('ready');status.textContent='The forest has revealed a loose corner. Peel it back!';showNote('A secret corner of the forest has come loose!')}}else{progress=name===sequence[0]?1:0;status.textContent='The forest settles again. Keep exploring.'}}document.querySelectorAll('[data-animal]').forEach(b=>b.addEventListener('click',()=>clickAnimal(b.dataset.animal)));peel.addEventListener('click',()=>{stage.classList.add('revealed');status.textContent='The next forest is unfolding…';setTimeout(()=>{window.location.assign('redwood.html')},1450)});document.getElementById('return').addEventListener('click',()=>stage.classList.remove('revealed'));document.getElementById('reset').addEventListener('click',()=>{progress=0;bluejayClicks=0;document.querySelectorAll('.animal').forEach(e=>e.classList.remove('go','at-bridge','fly-bridge','crouch','head-up'));document.getElementById('chipmunk-nut').classList.remove('drop');peel.classList.remove('ready');stage.classList.remove('revealed');status.textContent='Explore the creatures. A secret sequence unlocks the next layer.';showNote('The woodland mystery begins again.')});document.getElementById('sound').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊 Sound on':'🔇 Sound off';e.currentTarget.setAttribute('aria-pressed',String(sound));if(sound){tone(680,.12)}})})();
</script></body></html>
