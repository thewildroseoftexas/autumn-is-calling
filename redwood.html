<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beyond the Autumn Forest</title><style>
*{box-sizing:border-box}body{margin:0;background:#142016;color:#f5e9cb;font-family:Georgia,serif;text-align:center}.frame{position:relative;width:min(100%,1536px);aspect-ratio:3/2;margin:auto;overflow:hidden}.frame>img{width:100%;height:100%;display:block}.hit{position:absolute;border:0;background:transparent;border-radius:50%;cursor:pointer;touch-action:manipulation}.hit:focus-visible{outline:3px solid #ffe4a5}.hit:hover{box-shadow:inset 0 0 0 1px #f9d99870}.hit:disabled{cursor:default;pointer-events:none}.effect{position:absolute;pointer-events:none;opacity:0;z-index:3;font-size:clamp(18px,3vw,44px);filter:drop-shadow(0 2px 4px #111);transition:transform 1.2s,opacity .5s}.effect.on{opacity:1}.scroll,.bubble{position:absolute;z-index:7;background:#f1dfb5;color:#382916;border:3px solid #9b693c;box-shadow:0 8px 25px #0009;padding:1.2rem;border-radius:18px;line-height:1.45}.scroll{left:50%;top:50%;width:min(85%,510px);transform:translate(-50%,-50%);max-height:80%;overflow:auto}.scroll[hidden],.bubble[hidden]{display:none}.scroll button{font:inherit;background:#5d412b;color:#fff3d5;border:0;border-radius:8px;padding:8px 17px;cursor:pointer}.bubble{right:19%;top:8%;width:24%;font-size:clamp(10px,1.3vw,18px);border-radius:40%;animation:fadeBubble 6s forwards}.bubble:after{content:'◦ ◦';position:absolute;right:-10%;bottom:-25%;color:#f1dfb5;font-size:2rem}@keyframes fadeBubble{0%,70%{opacity:1}100%{opacity:0}}.panel{padding:10px 16px;display:flex;justify-content:center;gap:12px;align-items:center;flex-wrap:wrap}.panel button{font:inherit;border:1px solid #a28d5a;background:#253723;color:#f5e9cb;padding:8px 13px;border-radius:9px;cursor:pointer}.panel p{margin:0}.chestglow{position:absolute;left:88%;top:14%;width:9%;height:11%;border-radius:50%;box-shadow:0 0 32px 12px #f8d46a;pointer-events:none;animation:pulse 1.5s infinite alternate}@keyframes pulse{to{opacity:.2}}.hidden{display:none!important}.foot{font-size:.82rem;opacity:.8;padding:0 10px 15px}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}

.art{position:absolute;z-index:3;pointer-events:none;object-fit:fill;transform-origin:center;transition:transform 1.45s cubic-bezier(.2,.7,.25,1),opacity 1s;filter:drop-shadow(0 1px 1px #1a130d50)}
.art-snail{transform:translateX(0)}.art-snail.on{transform:translateX(95%)}
.art-centipede.on{transform:translateX(-68%) translateY(12%) rotate(-5deg)}
.art-ladybug{transform-origin:center}.art-ladybug.on{transform:translate(2860%,-110%) rotate(-22deg) scale(.7);transition-duration:3.3s}
.art-yellow{transform-origin:55% 92%}.art-yellow.on{transform:rotate(73deg)}
.art-shelves{transform-origin:35% 65%}.art-shelves.on{transform:scale(1.5)}
.art-shaggy{transform-origin:50% 85%}.art-shaggy.on{transform:scaleY(.28);opacity:.15}
.art-turtle{transform-origin:35% 72%}.art-turtle.on{transform:translateY(11%) rotate(17deg)}
.art-owl{transform-origin:80% 65%}.art-owl.on{transform:translateX(-42%) rotate(-9deg)}
.tree-shimmer{position:absolute;left:69%;top:20%;width:8%;height:17%;z-index:3;pointer-events:none;opacity:0;background:radial-gradient(ellipse,#f9d88660,transparent 70%);transition:opacity 1s}
.tree-shimmer.on{opacity:1;animation:treeRustle 1s ease-in-out 2}
@keyframes treeRustle{0%,100%{transform:rotate(0)}35%{transform:rotate(2deg)}70%{transform:rotate(-2deg)}}
</style></head><body><div class="frame" id="frame"><img src="redwood-animation-plate.webp" alt="Sunlit redwood forest with a snail, mushrooms, turtle, ladybug, centipede, owl and treasure chest" draggable="false">
<!-- Interactive targets are placed as percentages to match the original illustration. -->
<button class="hit" style="left:90%;top:48%;width:6%;height:15%" data-act="shaggy" aria-label="Inspect the tall white mushroom"></button>
<button class="hit" style="left:73%;top:76%;width:22%;height:12%" data-act="centipede" aria-label="Inspect the centipede"></button>
<button class="hit" style="left:9%;top:56%;width:6%;height:7%" data-act="snail" aria-label="Inspect the snail"></button>
<button class="hit" style="left:42%;top:18%;width:8%;height:13%" data-act="shelves" aria-label="Inspect the shelf mushrooms"></button>
<button class="hit" style="left:3%;top:77%;width:12%;height:12%" data-act="yellow" aria-label="Inspect the yellow mushroom"></button>
<button class="hit" style="left:29%;top:47%;width:13%;height:10%" data-act="turtle" aria-label="Inspect the turtle"></button>
<button class="hit" style="left:9%;top:31%;width:5%;height:7%" data-act="ladybug" aria-label="Inspect the ladybug"></button>
<button class="hit" style="left:70%;top:18%;width:9%;height:22%" data-act="tree" aria-label="Inspect the small evergreen tree"></button>

<button class="hit" id="chest" style="left:88%;top:13%;width:11%;height:12%" aria-label="Inspect the treasure chest"></button>
<button class="hit" style="left:2%;top:66%;width:7%;height:12%" data-clue="flowers" aria-label="Look closely at the white flowers"></button>
<button class="hit" style="left:46%;top:75%;width:7%;height:9%" data-clue="log" aria-label="Inspect the fallen log"></button>
<button class="hit" style="left:12%;top:84%;width:7%;height:10%" data-clue="clover" aria-label="Inspect the four-leaf clover"></button>
<button class="hit" style="left:81%;top:30%;width:7%;height:14%" data-clue="stump" aria-label="Inspect the stump"></button>
<button class="hit" style="left:29%;top:25%;width:5%;height:9%" data-after="a" disabled aria-label="Investigate a faint mark among the trees"></button>
<button class="hit" style="left:37%;top:0%;width:5%;height:7%" data-after="b" disabled aria-label="Investigate a mark high in the forest"></button>
<img class="art art-shaggy" id="a-shaggy" src="shaggy.png" alt="" aria-hidden="true" style="left:90.1693%;top:48.9258%;width:4.3620%;height:12.6953%"><img class="art art-centipede" id="a-centipede" src="centipede.png" alt="" aria-hidden="true" style="left:73.8932%;top:76.4648%;width:15.2995%;height:10.1562%"><img class="art art-snail" id="a-snail" src="snail.png" alt="" aria-hidden="true" style="left:9.1146%;top:56.6406%;width:5.0781%;height:5.5664%"><img class="art art-shelves" id="a-shelves" src="shelves.png" alt="" aria-hidden="true" style="left:42.2526%;top:18.3594%;width:7.1615%;height:11.6211%"><img class="art art-yellow" id="a-yellow" src="yellow.png" alt="" aria-hidden="true" style="left:2.5391%;top:78.4180%;width:11.9792%;height:10.0586%"><img class="art art-turtle" id="a-turtle" src="turtle-head.png" alt="" aria-hidden="true" style="left:36.8490%;top:48.1445%;width:4.2969%;height:6.2500%"><img class="art art-ladybug" id="a-ladybug" src="ladybug.png" alt="" aria-hidden="true" style="left:10.2214%;top:31.7383%;width:2.1484%;height:4.8828%"><img class="art art-owl" id="a-owl" src="owl.png" alt="" aria-hidden="true" style="left:64.9089%;top:17.0898%;width:4.1016%;height:11.7188%"><span class="tree-shimmer" id="a-tree" aria-hidden="true"></span><div class="chestglow hidden" id="chestglow"></div>
<div class="bubble" id="bubble" hidden>Look further in the forest for how to read the scroll.</div><section class="scroll" id="scroll" role="dialog" aria-modal="true" aria-labelledby="scroll-title" hidden><h2 id="scroll-title">A Whisper from the Forest</h2><div id="scroll-text"></div><p><button id="close">Close parchment</button></p></section></div>
<div class="panel"><button id="reset">↻ Begin again</button><button id="back">↶ Return to autumn</button><p id="status" aria-live="polite">The forest is waiting.</p></div><p class="foot">Explore carefully. Some discoveries reveal themselves only when the forest is ready.</p>
<script>(()=>{'use strict';const steps=['shaggy','centipede','snail','shelves','yellow','turtle','ladybug','tree','owl'];let n=0,unlocked=false,opened=false,bubbleTimer;const $=id=>document.getElementById(id);const lines={flowers:'The forest’s first secret wears a shaggy crown of white. When its crown falls, the many-footed wanderer begins its journey.',log:'The many-footed traveler leads the one who carries its home. Only after the slow traveler moves may the wooden shelves grow.',clover:'When the shelves have grown, the golden umbrella bows. The shelled guardian waits until the golden one has fallen.',stump:'After the guardian bows its head, the spotted traveler takes flight. Follow her to the little tree, where a watchful pair of eyes guards the final secret.',a:'Where the abyss whispers, even familiar letters wear unfamiliar faces.',b:'An ancient hymn holds the second voice. Its letters sing in a tongue few remember.'};function parchment(title,content){$('scroll-title').textContent=title;$('scroll-text').textContent=content;$('scroll').hidden=false;$('close').focus()}function act(name){if(opened)return;if(name===steps[n]){n++;const e=$('a-'+name);if(e)e.classList.add('on');if(name==='tree'){n++;$('a-owl').classList.add('on')}if(n===steps.length){unlocked=true;$('chestglow').classList.remove('hidden');$('status').textContent='Something glimmers beside the old stump.'}}else{n=0;document.querySelectorAll('.art,.tree-shimmer').forEach(e=>e.classList.remove('on'));$('chestglow').classList.add('hidden');unlocked=false;$('status').textContent='The forest is waiting.'}}document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>act(b.dataset.act)));document.querySelectorAll('[data-clue]').forEach(b=>b.addEventListener('click',()=>parchment('A Forest Whisper',lines[b.dataset.clue])));document.querySelectorAll('[data-after]').forEach(b=>b.addEventListener('click',()=>{if(opened)parchment('A Faint Inscription',lines[b.dataset.after])}));$('chest').addEventListener('click',()=>{if(!unlocked)return;opened=true;$('chestglow').classList.add('hidden');document.querySelectorAll('[data-after]').forEach(b=>b.disabled=false);parchment('The Chest Opens','Two ancient scripts are etched upon a scroll. Their completed glyph artwork will be placed here after both alphabets have been verified. The forest may offer a whisper about their origins.');$('bubble').hidden=false;clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>$('bubble').hidden=true,6000);$('status').textContent='The scroll has been discovered.'});$('close').addEventListener('click',()=>$('scroll').hidden=true);function reset(){n=0;unlocked=false;opened=false;$('scroll').hidden=true;$('bubble').hidden=true;$('chestglow').classList.add('hidden');document.querySelectorAll('.art,.tree-shimmer').forEach(e=>e.classList.remove('on'));document.querySelectorAll('[data-after]').forEach(b=>b.disabled=true);$('status').textContent='The forest is waiting.'} $('reset').addEventListener('click',reset);$('back').addEventListener('click',()=>{if(window.parent!==window)window.parent.postMessage('redwood-return','*');else window.location.href='index.html'});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('scroll').hidden=true});})();</script></body></html>
